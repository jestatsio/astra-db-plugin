name: Release

# Stages @erichare/astra-mcp for npm approval (trusted publishing + provenance),
# then publishes to the MCP Registry (GitHub OIDC) and creates a GitHub Release
# with the Claude Desktop .mcpb and the IBM Bob bundle.
#
# - Push a tag vX.Y.Z (matching every manifest), or
# - run it manually on any branch: it releases the version in the manifests at
#   that commit — publish from a branch first, then merge, so marketplace
#   installs never point at an unpublished server.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        default: false
      npm_tag:
        description: "npm dist-tag"
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: v
        run: |
          version=$(node -p 'require("./server/package.json").version')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"; else node scripts/check-versions.mjs; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  npm:
    needs: [verify, version]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Use npm with staged trusted publishing
        run: npm install -g npm@12.1.0
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - name: Check the exact published npm version
        id: npm-state
        run: |
          state=$(node ../scripts/verify-publication.mjs npm --allow-missing)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Stage npm package for maintainer approval
        if: steps.npm-state.outputs.state == 'missing'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NPM_TAG: ${{ inputs.npm_tag || 'latest' }}
        run: |
          # Pre-release versions (2.1.0-rc.1) never take over "latest".
          case "$VERSION" in *-*) if [ "$NPM_TAG" = latest ]; then NPM_TAG=next; fi ;; esac
          {
            echo "### npm approval required: @erichare/astra-mcp@${VERSION}"
            echo "Review this run's source commit and staged package on [npmjs.com](https://www.npmjs.com/package/@erichare/astra-mcp/access), then approve with 2FA within 20 minutes."
            echo "If staging reports E409 (a version conflict), inspect the staged version there, approve the expected artifact, then rerun failed jobs. Conflicts and authentication errors are never automatically accepted."
            echo "If the approval wait times out, approve the expected artifact and rerun failed jobs; the public package's namespace, repository, and source commit must match."
          } >> "$GITHUB_STEP_SUMMARY"
          npm stage publish --provenance --access public --tag "$NPM_TAG"
      - name: Await npm approval and verify the public package
        if: steps.npm-state.outputs.state == 'missing'
        timeout-minutes: 25
        run: node ../scripts/verify-publication.mjs npm --wait-for-approval
      - name: Smoke-test the published package
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Published-package smoke test $attempt/6"
            if actual=$(npx -y "@erichare/astra-mcp@${VERSION}" --version) && [ "$actual" = "$VERSION" ]; then exit 0; fi
            sleep 10
          done
          exit 1

  registry:
    needs: [npm, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish server.json to the MCP Registry
        working-directory: server
        run: |
          state=$(node ../scripts/verify-publication.mjs registry --allow-missing)
          if [ "$state" = missing ]; then
            curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
            echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
            tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" mcp-publisher
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi
          node ../scripts/verify-publication.mjs registry --wait

  github-release:
    needs: [npm, registry, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Build release assets
        working-directory: server
        run: |
          npm ci --no-fund --no-audit
          npm run build
          npm run pack:mcpb
          node dist/cli.js bob-bundle --out "dist/astra-db-bob.zip"
      - name: Hash release assets
        working-directory: server/dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha256sum "astra-db-${VERSION}.mcpb" astra-db.mcpb astra-db-bob.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          release_args=()
          if [ "$PRERELEASE" = --prerelease ]; then release_args+=(--prerelease); fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            release_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${VERSION}" --jq .sha)
            if [ "$release_sha" != "$GITHUB_SHA" ]; then echo "::error::Existing release tag points at a different source commit"; exit 1; fi
            gh release upload "v${VERSION}" "server/dist/astra-db-${VERSION}.mcpb" server/dist/astra-db.mcpb server/dist/astra-db-bob.zip server/dist/SHA256SUMS --clobber
          else
            gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" "${release_args[@]}" \
              "server/dist/astra-db-${VERSION}.mcpb" server/dist/astra-db.mcpb server/dist/astra-db-bob.zip server/dist/SHA256SUMS
          fi
